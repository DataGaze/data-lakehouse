[project]
name = "data-lakehouse"
version = "0.1.0"
description = "Data Lakehouse Platform — Bronze/Silver (SeaweedFS) + Gold (PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
