[project]
name = "superset-mcp"
version = "0.1.0"
description = "MCP server for Apache Superset — create datasets, charts, dashboards via Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
superset-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
